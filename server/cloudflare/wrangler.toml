# Breachline relay — deploy with:  cd server/cloudflare && npx wrangler deploy
name = "breachline-relay"
main = "worker.js"
compatibility_date = "2024-11-01"

[[durable_objects.bindings]]
name = "ROOMS"
class_name = "Room"

# SQLite-backed Durable Objects are available on the Workers free plan.
[[migrations]]
tag = "v1"
new_sqlite_classes = ["Room"]

# Optional: restrict the relay to your own site.
# [vars]
# ALLOWED_ORIGIN = "https://your-project.pages.dev"
